name: Build Linux binary

on:
  push:
    branches: [mine]
    paths:
      - 'src/**/*.rs'
      - 'tests/**/*.rs'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install Linux sandbox prerequisites
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y -o Acquire::Retries=3 bubblewrap build-essential
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --features test-hooks
      - run: cargo build --locked --release
      - name: Package binary and checksum
        run: |
          set -eu
          mkdir -p dist
          tar czf dist/ai-jail-linux-x86_64.tar.gz -C target/release ai-jail
          cd dist
          sha256sum ai-jail-linux-x86_64.tar.gz > ai-jail-linux-x86_64.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-jail-linux-x86_64
          path: |
            dist/ai-jail-linux-x86_64.tar.gz
            dist/ai-jail-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  attest:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ai-jail-linux-x86_64
      - name: Verify checksum
        run: sha256sum -c ai-jail-linux-x86_64.tar.gz.sha256
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ai-jail-linux-x86_64.tar.gz
          show-summary: true
